[package]
name = "azul_alphazero"
version = "0.0.0"
edition = "2024"
publish = false
description = "A player trained from scratch by self-play on azul_engine (spec 0011)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "alphazero"
path = "src/main.rs"

# [Z11-2]: the player itself depends on the engine alone; the rest are the
# general-purpose crates the spec lists, and the source check holds this
# section to that list.
[dependencies]
azul_engine = { path = "../engine-rs" }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rand = { version = "0.10.3", default-features = false, features = ["alloc"] }
rand_distr = { version = "0.6.0", default-features = false, features = ["alloc", "std_math"] }
rand_xoshiro = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "fat"

# [Z11-64]: the searches of the suite run the census check of [Z11-51] at every
# expansion, which needs debug assertions, at a speed only optimisation gives.
[profile.test]
opt-level = 2
debug-assertions = true
